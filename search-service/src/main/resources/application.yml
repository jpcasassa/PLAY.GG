server:
  port: 8090
spring:
  application:
    name: search-service
  datasource:
    url: jdbc:mysql://localhost:3306/playgg_search_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    com.playgg.search: INFO
