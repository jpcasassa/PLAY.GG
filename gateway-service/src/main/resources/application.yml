server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates: [ Path=/users/** ]
        - id: profile-service
          uri: lb://profile-service
          predicates: [ Path=/profiles/** ]
        - id: forum-service
          uri: lb://forum-service
          predicates: [ Path=/posts/**, /comments/** ]
        - id: community-service
          uri: lb://community-service
          predicates: [ Path=/communities/** ]
        - id: game-service
          uri: lb://game-service
          predicates: [ Path=/games/** ]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    com.playgg.gateway: INFO
