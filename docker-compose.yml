    environment:
      <<: *common-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/playgg_notifications_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started
      user-service:
        condition: service_started

  game-service:
    <<: *database-service
    build:
      context: .
      dockerfile: game-service/Dockerfile
    image: playgg/game-service:latest
    container_name: playgg-game-service
    ports:
      - "8088:8088"
    environment:
      <<: *common-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/playgg_games_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

  collectible-service:
    <<: *database-service
    build:
      context: .
      dockerfile: collectible-service/Dockerfile
    image: playgg/collectible-service:latest
    container_name: playgg-collectible-service
    ports:
      - "8089:8089"
    environment:
      <<: *common-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/playgg_collectibles_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started
      user-service:
        condition: service_started
      game-service:
        condition: service_started

networks:
  playgg-network:
    driver: bridge

volumes:
  mysql-data:
